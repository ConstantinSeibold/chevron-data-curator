[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chevron-curator"
version = "0.1.0"
description = "Local dataset curation from segmentation proposals — cluster, label, refine and export instance masks, with latent-space navigation."
readme = "README.md"
license = { file = "LICENSE" }
# 3.12 is the only version the project is actually run and tested on. Nothing in the source needs it
# — there is no match statement and no 3.11+ stdlib — but with no CI there is nobody checking 3.10 or
# 3.11, so the floor states what is true rather than what would probably work.
requires-python = ">=3.12"
authors = [{ name = "Constantin Seibold" }]
keywords = ["segmentation", "annotation", "curation", "active-learning", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Base install is CPU-only and torch-free on purpose: the whole test suite runs on it, which is what
# keeps the core honest about not depending on any model stack. A `pip install -e ".[dev]"` in a fresh
# environment is enough to run every test.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pycocotools>=2.0.6",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "joblib>=1.3",
    "finch-clust>=0.2",
]

[project.optional-dependencies]
# Latent-space Map: dimensionality reduction + the query-projection DR menu.
# openTSNE (not sklearn's TSNE) because only it can `.transform` a NEW point into a fitted space.
viz = ["hnne>=0.1.10", "umap-learn>=0.5.6", "openTSNE>=1.0", "matplotlib>=3.7"]
# Embedding extractors (RAD-DINO, DINOv2, CLIP, SigLIP2) run in-process — no Triton, no ONNX.
embed = ["torch>=2.1", "transformers>=4.40"]
# SAM / SAM-HQ / MedSAM: mask refinement today, automatic proposal generation from P5.
# Both forks are listed because they are DIFFERENT top-level modules with different registries
# (`segment_anything` vs `segment_anything_hq`), not two versions of one package — they coexist, and
# torch, the only large dependency, is shared. MedSAM is not a package at all: it is a vit_b
# checkpoint loaded through the vanilla registry, pointed at by CURATOR_MEDSAM_CKPT.
sam = ["segment-anything>=1.0", "segment-anything-hq>=0.3"]
faiss = ["faiss-cpu>=1.7"]
cluster = ["hdbscan>=0.8"]
# starlette's TestClient needs an HTTP client, and WHICH one depends on the starlette version
# fastapi happens to resolve: <=1.5 wants httpx, >=1.6 wants httpx2. Both are declared so
# `pip install -e ".[dev]" && pytest` works whichever gets picked.
# pytest is >=8.0, not >=7.4: tests/conftest.py uses a new-style `@pytest.hookimpl(wrapper=True)`,
# which needs pluggy>=1.2. pytest 7.4 allows pluggy 1.0 and then dies during collection with
# "HookimplMarker.__call__() got an unexpected keyword argument 'wrapper'".
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2>=2.12"]
# Everything the app can use, minus `dev` and minus the two backends that are not pip-installable
# (qseg, and torchvision, which you install with the CUDA/CPU wheel that matches your machine).
all = [
    "hnne>=0.1.10", "umap-learn>=0.5.6", "openTSNE>=1.0", "matplotlib>=3.7",
    "torch>=2.1", "transformers>=4.40",
    "segment-anything>=1.0", "segment-anything-hq>=0.3",
    "faiss-cpu>=1.7", "hdbscan>=0.8",
]
# The `qseg` proposal backend additionally needs a qseg checkout + detectron2 + the MaskDINO
# submodule (neither is pip-installable); point CHEVRON_QSEG_ROOT at it. See chevron/backends/qseg.py.

[project.scripts]
chevron = "chevron.server:main"

[project.urls]
Homepage = "https://github.com/ConstantinSeibold/chevron-data-curator"

[tool.setuptools.packages.find]
include = ["chevron*"]

[tool.setuptools.package-data]
chevron = ["taxonomy_seed.json", "web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
