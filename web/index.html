<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qseg curator</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ec; --mut:#9aa3b2; --acc:#4f8cff; --warn:#e0533d; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header .grow { flex:1; }
  button { background:#222633; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.warn { border-color:var(--warn); }
  input, select { background:#0c0e12; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  #status { color:var(--mut); font-size:12px; }
  .feats label { margin-right:8px; color:var(--mut); }
  main { display:flex; height:calc(100vh - 50px); }
  #left { width:300px; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #left .hd { padding:8px; border-bottom:1px solid var(--line); }
  #plist { overflow:auto; flex:1; }
  .prow { padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .prow:hover { background:#1c2230; }
  .prow.sel { background:#243049; }
  .prow .sz { color:var(--mut); }
  .prow .cls { color:var(--acc); font-size:11px; }
  #right { flex:1; display:flex; flex-direction:column; }
  #toolbar { padding:8px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #grid { overflow:auto; flex:1; padding:10px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; align-content:start; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px; }
  .cell.sel { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .cell img { width:100%; height:140px; object-fit:contain; background:#000; border-radius:4px; cursor:pointer; display:block; }
  .cell .cap { font-size:10px; color:var(--mut); margin-top:3px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .muted { color:var(--mut); padding:20px; }
  .pager { padding:8px; text-align:center; color:var(--mut); }
</style>
</head>
<body>
<header>
  <strong>qseg curator</strong>
  <span class="feats" id="feats"></span>
  <button id="clusterBtn" class="primary">Cluster</button>
  <label>level <select id="levelSel"></select></label>
  <span id="status">…</span>
  <span class="grow"></span>
  <button id="exportBtn">Export COCO</button>
</header>
<main>
  <div id="left">
    <div class="hd"><input id="search" placeholder="search partitions (id / class)…" style="width:100%"><div id="pcount" style="color:var(--mut);font-size:11px;margin-top:4px"></div></div>
    <div id="plist"></div>
    <div class="pager"><button id="pmore" style="display:none">load more partitions</button></div>
  </div>
  <div id="right">
    <div id="toolbar">
      <input id="classInput" placeholder="class name" list="classList" style="width:160px"><datalist id="classList"></datalist>
      <button id="assignBtn" class="primary">Assign selected</button>
      <button id="assignAllBtn">Assign whole partition</button>
      <button id="rejectBtn" class="warn">Reject</button>
      <button id="unassignBtn">Unassign</button>
      <button id="mergeBtn">Merge selected</button>
      <span class="grow" style="flex:1"></span>
      <button id="selAll">select page</button>
      <button id="selNone">clear</button>
      <span id="selcount" style="color:var(--mut)">0 selected</span>
    </div>
    <div id="grid"><div class="muted">Cluster, then pick a partition on the left.</div></div>
    <div class="pager"><button id="imore" style="display:none">load more instances</button></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const api = async (url, opts) => (await fetch(url, opts)).json();
const post = (url, body) => api(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});

let PART = {offset:0, limit:100, total:0, query:""};
let INST = {pid:null, offset:0, limit:60, total:0};
const SEL = new Set();                                   // selected iuids on the current partition

function setStatus(s){
  $("#status").textContent = `${s.n_instances} inst · ${s.n_assigned} assigned · ${s.n_unassigned} unassigned · ${s.n_background} rejected · ${s.n_classes} classes`;
}
function setClasses(cls){
  $("#classList").innerHTML = cls.map(c=>`<option value="${c}">`).join("");
}

async function refreshState(){
  const st = await api("/api/state");
  setStatus(st.stats); setClasses(st.classes);
  $("#feats").innerHTML = st.features.map(f=>`<label><input type=checkbox class=feat value="${f}" ${(f=='decoder')?'checked':''}>${f}</label>`).join("");
  $("#levelSel").innerHTML = st.levels.map(l=>`<option value="${l.i}" ${l.i===st.level?'selected':''}>L${l.i} (${l.n})</option>`).join("");
  if (st.clustered) loadPartitions(true);
}

async function loadPartitions(reset){
  if (reset){ PART.offset=0; $("#plist").innerHTML=""; }
  const r = await api(`/api/partitions?offset=${PART.offset}&limit=${PART.limit}&query=${encodeURIComponent(PART.query)}`);
  PART.total = r.total;
  $("#pcount").textContent = `${r.total} partitions${r.total>PART.limit?` (showing ${Math.min(PART.offset+PART.limit, r.total)})`:''}`;
  const html = r.rows.map(p=>`<div class="prow" data-pid="${p.pid}"><span>${p.pid}${p.cls?` <span class=cls>[${p.cls}]</span>`:''}</span><span class="sz">${p.size} · ${p.score??''}</span></div>`).join("");
  $("#plist").insertAdjacentHTML("beforeend", html);
  PART.offset += r.rows.length;
  $("#pmore").style.display = (PART.offset < r.total) ? "inline-block" : "none";
}

async function selectPartition(pid){
  INST.pid = pid; INST.offset = 0; SEL.clear(); updateSelCount();
  document.querySelectorAll(".prow").forEach(e=>e.classList.toggle("sel", e.dataset.pid===pid));
  $("#grid").innerHTML = "";
  await loadInstances(true);
}

async function loadInstances(reset){
  if (!INST.pid) return;
  if (reset){ INST.offset=0; }
  const r = await api(`/api/instances?pid=${encodeURIComponent(INST.pid)}&offset=${INST.offset}&limit=${INST.limit}`);
  INST.total = r.total;
  if (reset && r.items.length===0){ $("#grid").innerHTML = `<div class="muted">(empty — assign/reject emptied this partition)</div>`; }
  const html = r.items.map(it=>`
    <div class="cell" data-iuid="${it.iuid}">
      <img loading="lazy" src="/api/crop?iuid=${encodeURIComponent(it.iuid)}&max_side=256">
      <div class="cap" title="${it.caption}">${it.caption}</div>
    </div>`).join("");
  $("#grid").insertAdjacentHTML("beforeend", html);
  INST.offset += r.items.length;
  $("#imore").style.display = (INST.offset < r.total) ? "inline-block" : "none";
}

function updateSelCount(){ $("#selcount").textContent = `${SEL.size} selected`; }
function toggleCell(cell){
  const u = cell.dataset.iuid;
  if (SEL.has(u)){ SEL.delete(u); cell.classList.remove("sel"); } else { SEL.add(u); cell.classList.add("sel"); }
  updateSelCount();
}

// after a mutation: drop the affected iuids from the grid client-side (no reload), refresh counts + partition sizes
function dropFromGrid(iuids){
  const s = new Set(iuids);
  document.querySelectorAll(".cell").forEach(c=>{ if (s.has(c.dataset.iuid)) c.remove(); });
  iuids.forEach(u=>SEL.delete(u)); updateSelCount();
}
async function afterMutation(resp, dropped){
  if (resp.stats) setStatus(resp.stats);
  if (resp.classes) setClasses(resp.classes);
  if (dropped) dropFromGrid(dropped);
  loadPartitions(true);                                  // sizes changed
}

// ---- events ----
$("#clusterBtn").onclick = async ()=>{
  const feats = [...document.querySelectorAll(".feat:checked")].map(e=>e.value);
  $("#status").textContent = "clustering…";
  const r = await post("/api/cluster", {features:feats});
  await refreshState();
};
$("#levelSel").onchange = async (e)=>{ await post("/api/level", {level:+e.target.value}); loadPartitions(true); };
$("#search").oninput = (e)=>{ PART.query = e.target.value; clearTimeout(window._st); window._st=setTimeout(()=>loadPartitions(true), 200); };
$("#pmore").onclick = ()=>loadPartitions(false);
$("#imore").onclick = ()=>loadInstances(false);
$("#plist").onclick = (e)=>{ const r=e.target.closest(".prow"); if (r) selectPartition(r.dataset.pid); };
$("#grid").onclick = (e)=>{ const c=e.target.closest(".cell"); if (c) toggleCell(c); };
$("#selAll").onclick = ()=>{ document.querySelectorAll(".cell").forEach(c=>{ SEL.add(c.dataset.iuid); c.classList.add("sel"); }); updateSelCount(); };
$("#selNone").onclick = ()=>{ SEL.clear(); document.querySelectorAll(".cell").forEach(c=>c.classList.remove("sel")); updateSelCount(); };

$("#assignBtn").onclick = async ()=>{
  const cls = $("#classInput").value.trim(); if (!cls || !SEL.size) return;
  const iuids = [...SEL];
  afterMutation(await post("/api/assign", {iuids, cls}), iuids);
};
$("#assignAllBtn").onclick = async ()=>{
  const cls = $("#classInput").value.trim(); if (!cls || !INST.pid) return;
  // assign the whole partition: pull all its iuids (server resolves) — send pid via a dedicated call
  const all = await api(`/api/instances?pid=${encodeURIComponent(INST.pid)}&offset=0&limit=100000`);
  const iuids = all.items.map(i=>i.iuid);
  afterMutation(await post("/api/assign", {iuids, cls}), iuids);
};
$("#rejectBtn").onclick = async ()=>{ if (!SEL.size) return; const iuids=[...SEL]; afterMutation(await post("/api/reject", {iuids}), iuids); };
$("#unassignBtn").onclick = async ()=>{ if (!SEL.size) return; const iuids=[...SEL]; afterMutation(await post("/api/unassign", {iuids}), iuids); };
$("#mergeBtn").onclick = async ()=>{ if (SEL.size<2) return; const iuids=[...SEL]; afterMutation(await post("/api/merge", {iuids}), iuids); selectPartition(INST.pid); };
$("#exportBtn").onclick = async ()=>{ const r=await post("/api/export",{}); alert("Exported COCO → "+r.path); };

refreshState();
</script>
</body>
</html>
