<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chevron — sign in</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e8ec; --mut:#9aa3b2;
    --acc:#4f8cff; --warn:#e0533d; --r1:6px; --r2:10px;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
    font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased;
  }
  form {
    width:320px; padding:32px 28px 28px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--r2); display:flex; flex-direction:column; gap:12px;
  }
  .brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; }
  .brand svg { width:30px; height:30px; }
  h1 { margin:0; font-size:22px; font-weight:650; letter-spacing:-.02em; }
  label { display:flex; flex-direction:column; gap:4px; color:var(--mut); font-size:12px; }
  input {
    font:inherit; color:inherit; background:#0c0e12; border:1px solid var(--line); border-radius:var(--r1);
    padding:9px 11px; outline:none;
  }
  input:focus { border-color:var(--acc); }
  button {
    font:inherit; margin-top:6px; padding:9px; border:0; border-radius:var(--r1); cursor:pointer;
    background:var(--acc); color:#fff; font-weight:550;
  }
  button:disabled { opacity:.5; cursor:default; }
  .err { min-height:18px; color:var(--warn); font-size:12px; text-align:center; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M6 4l10 12L6 28" stroke="#4f8cff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 4l10 12-10 12" stroke="#4f8cff" stroke-width="3.4" stroke-linecap="round"
            stroke-linejoin="round" opacity=".42"/>
    </svg>
    <h1>Chevron</h1>
  </div>
  <label>Username <input id="u" name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Password <input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button id="go" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
// only same-site paths: never bounce a fresh session to another origin
const next = (() => { try { const u = new URL(new URLSearchParams(location.search).get("next") || "/", location.origin);
  return u.origin === location.origin ? u.pathname + u.search + u.hash : "/"; } catch (_) { return "/"; } })();
f.onsubmit = async (e) => {
  e.preventDefault(); err.textContent = ""; go.disabled = true;
  try {
    const r = await fetch("/api/auth/login", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: f.username.value, password: f.password.value})});
    if (r.ok) { location.replace(next); return; }
    err.textContent = (await r.json().catch(() => ({}))).detail || "Sign-in failed.";
    f.password.select();
  } catch (_) { err.textContent = "Server unreachable."; }
  go.disabled = false;
};
</script>
</body>
</html>
